# 청빙 공고 자동 수집 + 사이트 배포
#  - 하루 3번: 한국 시간 06·12·18시에 시작하는 「수집 시간대」마다 한 번씩 scraper를 돌려 data/jobs.*를 갱신·커밋하고 사이트를 배포
#  - 예약은 06~23시(KST) 매시 17·47분에 깨어나, 이번 시간대에 아직 수집하지 않았을 때만 수집하고 아니면 바로 끝낸다.
#    GitHub가 예약 실행을 자주 빠뜨려서(10/12 18:07, 10/13 06:07·06:47 누락, 03:51에 엉뚱하게 1회) 정해진 한 시각 대신
#    시간대 안의 여러 기회 중 처음 돈 것이 수집하게 했다. 시간대: 06:00~11:59, 12:00~17:59, 18:00~다음 날 05:59
#  - main에 직접 올릴 때(push): 수집 없이 배포만
#  - 수동: 저장소 → Actions → "청빙 공고 수집·배포" → Run workflow (옵션 칸을 비우면 전체 수집, 시간대와 상관없이 바로 돎)
#  - 해외 접속을 막는 출처(viaKR)는 서울 리전 Supabase 함수(kr-relay)를 거쳐 요청한다.
#    권한은 이 작업의 OIDC 토큰(id-token: write)으로 증명하므로 저장소 Secrets가 필요 없다(docs/운영가이드.md 6-3).
# 처음 한 번: Settings → Pages → Source를 "GitHub Actions"로 바꿔 주세요(docs/운영가이드.md 5-1).
name: 청빙 공고 수집·배포
on:
  schedule:
    - cron: '17,47 21-23,0-14 * * *'   # UTC 21~14시 = KST 06~23시, 매시 17·47분(정각 혼잡 피함). 수집 여부는 아래 guard가 정함
  workflow_dispatch:
    inputs:
      args:
        description: '수집기 옵션(비우면 전체 수집). 예: --only=chongshin,mokwon --dry --detail=0'
        required: false
        default: ''
      wake:
        description: '외부 예약(Supabase pg_cron)이 부를 때 true — 예약 실행처럼 이번 시간대에 이미 모았으면 건너뜀'
        required: false
        default: 'false'
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fetch-and-deploy
  cancel-in-progress: false
jobs:
  fetch:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      skipped: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # 예약 시점의 커밋이 아니라 지금의 main — 앞 회차가 늦게 돌아 대기열에서 겹쳐도 그 결과를 보고 건너뛰게
      - name: 이번 시간대에 수집이 필요한지 확인(예약 실행·외부 예약만)
        id: guard
        run: |
          up=$(jq -r .updatedAt data/jobs.json); upd=$(date -d "$up" +%s); now=$(date +%s)
          # 이번 수집 시간대의 시작(KST 06·12·18시, 06시 전이면 전날 18시)
          h=$(TZ=Asia/Seoul date -d "@$now" +%-H)
          if   [ "$h" -ge 18 ]; then s=18:00; d=$(TZ=Asia/Seoul date -d "@$now" +%F)
          elif [ "$h" -ge 12 ]; then s=12:00; d=$(TZ=Asia/Seoul date -d "@$now" +%F)
          elif [ "$h" -ge 6 ];  then s=06:00; d=$(TZ=Asia/Seoul date -d "@$now" +%F)
          else s=18:00; d=$(TZ=Asia/Seoul date -d "@$(( now - 86400 ))" +%F); fi
          start=$(date -d "$d $s +0900" +%s)
          last=$(TZ=Asia/Seoul date -d "$up" '+%m/%d %H:%M')
          echo "마지막 갱신 $last(KST), 이번 시간대 시작 $d $s"
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.wake }}" = "true" ]; } && [ "$upd" -ge "$start" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=건너뜀::이번 시간대($s~)에 이미 수집함(마지막 갱신 $last)"
          else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - name: 설치
        if: steps.guard.outputs.skip != 'true'
        run: npm ci
        working-directory: scraper
      - name: 파서·중계 점검(외부 요청 없이)
        if: steps.guard.outputs.skip != 'true'
        run: |
          node scraper/test-parsers.mjs
          node scraper/test-relay.mjs
      - name: 수집(출처별 결과가 로그에 남음)
        if: steps.guard.outputs.skip != 'true'
        env:
          KR_RELAY_URL: https://xjmexzeyxkxqsgvwaupz.supabase.co/functions/v1/kr-relay   # 공개값
          KR_RELAY_APIKEY: sb_publishable_1cyG9HPpcC4hqJZIv4wbuA_JpoS_UiQ                # config.js와 같은 공개(publishable) 키
          ARGS: ${{ inputs.args }}
        run: |
          if [[ ! "$ARGS" =~ ^[-a-z0-9=,\ ]*$ ]]; then echo "옵션에 허용하지 않은 글자가 있음: $ARGS"; exit 1; fi
          node scraper/fetch-jobs.mjs $ARGS
      # 클라우드 세션은 Actions 로그를 내려받지 못하므로 결과를 annotation으로 남긴다(node scripts/status.mjs가 읽음)
      - name: 결과 요약 남기기
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          ARGS: ${{ inputs.args }}
        run: |
          s=$(jq -r '"공고 \(.items|length)건(갱신 \(.updatedAt)) · 문제 출처: "
            + ([.sources[] | select(.status != "ok" and .status != "off") | "\(.id) \(.status) \((.note // "")[0:80])"] | join(" / ") | if . == "" then "없음" else . end)
            + " · 서울 중계: " + ([.sources[] | select((.note // "") | test("서울 중계")) | "\(.id) \(.status) \(.count // 0)건"] | join(", "))' data/jobs.json)
          echo "::notice title=수집 결과${ARGS:+ ($ARGS)}::${s//$'\n'/ }"
      - name: 바뀐 게 있으면 커밋
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/hero-stats.mjs || true   # 첫 화면 숫자 줄: 하루 한 번(그날 첫 수집 때) 다시 계산
          git add data/jobs.json data/jobs.js data/hero-stats.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "청빙 공고 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git pull --rebase -q origin main   # 그사이 맥이 보충 파일(jobs-local.json)을 올렸을 수 있음(파일이 달라 충돌 없음)
          git push

  deploy:
    needs: fetch
    if: always() && (needs.fetch.result == 'success' || needs.fetch.result == 'skipped') && needs.fetch.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # 방금 커밋한 공고까지 포함
      - name: 공개할 파일만 모으기
        run: |
          mkdir _site
          cp index.html config.js 404.html manifest.webmanifest _site/
          cp -r icons _site/
          cp -r data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
