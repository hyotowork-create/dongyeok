# 청빙 공고 자동 수집 + 사이트 배포
#  - 하루 3번(한국 시간 06·12·18시 7분): scraper를 돌려 data/jobs.*를 갱신·커밋한 뒤 사이트를 배포
#  - 보조 예약(47분): GitHub가 혼잡하면 예약 실행을 건너뛰는 일이 있어(10/12 18:07 미실행) 40분 뒤 한 번 더 시도한다.
#    직전 90분 안에 이미 갱신됐으면 수집·배포 없이 바로 끝낸다(같은 회차 두 번 수집 방지).
#  - main에 직접 올릴 때(push): 수집 없이 배포만
#  - 수동: 저장소 → Actions → "청빙 공고 수집·배포" → Run workflow (옵션 칸을 비우면 전체 수집)
#  - 해외 접속을 막는 출처(viaKR)는 서울 리전 Supabase 함수(kr-relay)를 거쳐 요청한다.
#    권한은 이 작업의 OIDC 토큰(id-token: write)으로 증명하므로 저장소 Secrets가 필요 없다(docs/운영가이드.md 6-3).
# 처음 한 번: Settings → Pages → Source를 "GitHub Actions"로 바꿔 주세요(docs/운영가이드.md 5-1).
name: 청빙 공고 수집·배포
on:
  schedule:
    - cron: '7 21,3,9 * * *'     # UTC 21:07·03:07·09:07 = KST 06:07·12:07·18:07 (정각 혼잡 피함)
    - cron: '47 21,3,9 * * *'    # 보조: KST 06:47·12:47·18:47 — 위 회차가 빠졌을 때만 실제로 수집
  workflow_dispatch:
    inputs:
      args:
        description: '수집기 옵션(비우면 전체 수집). 예: --only=chongshin,mokwon --dry --detail=0'
        required: false
        default: ''
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fetch-and-deploy
  cancel-in-progress: false
jobs:
  fetch:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      skipped: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # 예약 시점의 커밋이 아니라 지금의 main — 앞 회차가 늦게 돌아 대기열에서 겹쳐도 그 결과를 보고 건너뛰게
      - name: 이번 회차가 필요한지 확인(예약 실행만)
        id: guard
        run: |
          age=$(( $(date +%s) - $(date -d "$(jq -r .updatedAt data/jobs.json)" +%s) ))
          echo "마지막 갱신 후 $((age / 60))분"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$age" -lt 5400 ]; then
            echo "90분 안에 이미 갱신됨 — 이번 예약은 건너뜀"; echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=건너뜀::마지막 갱신 후 $((age / 60))분 — 90분 안이라 이번 예약은 수집하지 않음"
          else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - name: 설치
        if: steps.guard.outputs.skip != 'true'
        run: npm ci
        working-directory: scraper
      - name: 파서·중계 점검(외부 요청 없이)
        if: steps.guard.outputs.skip != 'true'
        run: |
          node scraper/test-parsers.mjs
          node scraper/test-relay.mjs
      - name: 수집(출처별 결과가 로그에 남음)
        if: steps.guard.outputs.skip != 'true'
        env:
          KR_RELAY_URL: https://xjmexzeyxkxqsgvwaupz.supabase.co/functions/v1/kr-relay   # 공개값
          KR_RELAY_APIKEY: sb_publishable_1cyG9HPpcC4hqJZIv4wbuA_JpoS_UiQ                # config.js와 같은 공개(publishable) 키
          ARGS: ${{ inputs.args }}
        run: |
          if [[ ! "$ARGS" =~ ^[-a-z0-9=,\ ]*$ ]]; then echo "옵션에 허용하지 않은 글자가 있음: $ARGS"; exit 1; fi
          node scraper/fetch-jobs.mjs $ARGS
      # 클라우드 세션은 Actions 로그를 내려받지 못하므로 결과를 annotation으로 남긴다(node scripts/status.mjs가 읽음)
      - name: 결과 요약 남기기
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          ARGS: ${{ inputs.args }}
        run: |
          s=$(jq -r '"공고 \(.items|length)건(갱신 \(.updatedAt)) · 문제 출처: "
            + ([.sources[] | select(.status != "ok" and .status != "off") | "\(.id) \(.status) \((.note // "")[0:80])"] | join(" / ") | if . == "" then "없음" else . end)
            + " · 서울 중계: " + ([.sources[] | select((.note // "") | test("서울 중계")) | "\(.id) \(.status) \(.count // 0)건"] | join(", "))' data/jobs.json)
          echo "::notice title=수집 결과${ARGS:+ ($ARGS)}::${s//$'\n'/ }"
      - name: 바뀐 게 있으면 커밋
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/jobs.js
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "청빙 공고 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git pull --rebase -q origin main   # 그사이 맥이 보충 파일(jobs-local.json)을 올렸을 수 있음(파일이 달라 충돌 없음)
          git push

  deploy:
    needs: fetch
    if: always() && (needs.fetch.result == 'success' || needs.fetch.result == 'skipped') && needs.fetch.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # 방금 커밋한 공고까지 포함
      - name: 공개할 파일만 모으기
        run: |
          mkdir _site
          cp index.html config.js 404.html _site/
          cp -r data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
